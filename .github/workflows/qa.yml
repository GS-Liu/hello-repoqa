name: QA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 回归测试：验证 rubric、规则、采集与人工质检的语义未被改坏
  # ---------------------------------------------------------------
  selftest:
    name: 回归测试（58 项断言）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确认零第三方依赖
        run: |
          cd code
          python -c "
import ast, pathlib, sys
stdlib_ok = True
for path in pathlib.Path('ghsqa').glob('*.py'):
    tree = ast.parse(path.read_text(encoding='utf-8'))
    for node in ast.walk(tree):
        if isinstance(node, ast.Import):
            for alias in node.names:
                root = alias.name.split('.')[0]
                if root not in sys.stdlib_module_names:
                    print('非标准库依赖:', root, '于', path)
                    stdlib_ok = False
print('零第三方依赖校验通过' if stdlib_ok else '发现第三方依赖')
sys.exit(0 if stdlib_ok else 1)
"

      - name: 运行回归测试
        run: |
          cd code
          python -m tests.run_tests

  # ---------------------------------------------------------------
  # 自检质检：用内置 fixtures 跑完整流水线，验证端到端可用
  # ---------------------------------------------------------------
  selfcheck:
    name: 端到端质检（fixtures 三场景）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 场景一：教程型仓库 —— 期望自动 PASS，但因未提交人工结论而返回 REVIEW(1)
      - name: 场景一 · 教程型仓库（期望 REVIEW，退出码 1）
        run: |
          cd code
          set +e
          python -m ghsqa check \
            --repo datawhalechina/hello-agents \
            --source fixtures --fixtures ../fixtures \
            --milestone 3 \
            --out ../out/hello-agents \
            --junit --quiet
          code=$?
          echo "退出码: $code"
          if [ "$code" -ne 1 ]; then
            echo "::error::期望退出码 1（REVIEW），实际 $code"
            exit 1
          fi

      # 场景二：常规工程仓库 —— 期望 REVIEW
      - name: 场景二 · 常规工程仓库（期望 REVIEW，退出码 1）
        run: |
          cd code
          set +e
          python -m ghsqa check \
            --repo acme/widget-toolkit \
            --source fixtures --fixtures ../fixtures \
            --milestone 7 \
            --out ../out/widget-toolkit \
            --junit --quiet
          code=$?
          echo "退出码: $code"
          if [ "$code" -ne 1 ]; then
            echo "::error::期望退出码 1（REVIEW），实际 $code"
            exit 1
          fi

      # 场景三：已归档仓库 —— 期望 REJECT
      - name: 场景三 · 已归档仓库（期望 REJECT，退出码 2）
        run: |
          cd code
          set +e
          python -m ghsqa check \
            --repo legacycorp/abandoned-metrics-lib \
            --source fixtures --fixtures ../fixtures \
            --out ../out/abandoned \
            --quiet
          code=$?
          echo "退出码: $code"
          if [ "$code" -ne 2 ]; then
            echo "::error::期望退出码 2（REJECT），实际 $code"
            exit 1
          fi

      # 场景四：人工确认后应放行 —— 期望 PASS(0)
      - name: 场景四 · 人工确认后放行（期望 PASS，退出码 0）
        run: |
          cd code
          python -m ghsqa init-review \
            --repo acme/widget-toolkit \
            --reviewer "CI Bot" \
            --out ../out/review.json
          python -c "import json; p='../out/review.json'; d=json.load(open(p,encoding='utf-8')); d['overall']='approve'; [x.update(verdict='accept', note='CI 自动回归：许可证与结构已确认') for x in d['decisions']]; json.dump(d, open(p,'w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          python -m ghsqa check \
            --repo acme/widget-toolkit \
            --source fixtures --fixtures ../fixtures \
            --milestone 7 \
            --review ../out/review.json \
            --out ../out/approved \
            --quiet

      - name: 上传质检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoqa-reports
          path: out/
          retention-days: 14
